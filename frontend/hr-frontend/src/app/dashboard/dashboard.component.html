<div class="dashboard-page">

  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">HR Agentic System</p>
  </div>

  <div *ngIf="user" class="dashboard-content">

    <!-- Welcome card -->
    <div class="welcome-card">
      <div class="welcome-avatar">{{ user.username.charAt(0).toUpperCase() }}</div>
      <div class="welcome-text">
        <h2 class="welcome-name">Hello, {{ user.username }}</h2>
        <p class="welcome-role-msg">{{ getRoleMessage() }}</p>
        <span class="welcome-role-badge role-{{ user.role.toLowerCase() }}">{{ user.role }}</span>
      </div>
    </div>

    <!-- Employee: real KPI cards (Phase 8.3) -->
    <ng-container *ngIf="user.role.toLowerCase() === 'employee'">
      <ng-container *ngIf="!kpiLoading; else kpiLoadingTpl">
        <div class="kpi-grid">
          <div class="kpi-card" [ngClass]="card.colorClass" *ngFor="let card of kpiCards">
            <div class="kpi-value">{{ card.value }}</div>
            <div class="kpi-label">{{ card.label }}</div>
            <div class="kpi-sublabel">{{ card.sublabel }}</div>
          </div>
        </div>
      </ng-container>
      <ng-template #kpiLoadingTpl>
        <div class="kpi-grid">
          <div class="kpi-placeholder" *ngFor="let _ of [1,2,3,4]"></div>
        </div>
      </ng-template>
    </ng-container>

    <!-- Manager/HR/Admin: placeholders for Phase 8.4 -->
    <ng-container *ngIf="user.role.toLowerCase() !== 'employee'">
      <div class="kpi-grid">
        <div class="kpi-placeholder"></div>
        <div class="kpi-placeholder"></div>
        <div class="kpi-placeholder"></div>
        <div class="kpi-placeholder"></div>
      </div>
      <div class="chart-placeholder"></div>
    </ng-container>

  </div>

  <div *ngIf="!user" class="loading">
    <p>Loading...</p>
  </div>

</div>
