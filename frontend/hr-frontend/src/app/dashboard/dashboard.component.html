<div class="dashboard-page">

  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">HR Agentic System</p>
  </div>

  <div *ngIf="user" class="dashboard-content">

    <!-- Welcome card -->
    <div class="welcome-card">
      <div class="welcome-avatar">{{ user.username.charAt(0).toUpperCase() }}</div>
      <div class="welcome-text">
        <h2 class="welcome-name">Hello, {{ user.username }}</h2>
        <p class="welcome-role-msg">{{ getRoleMessage() }}</p>
        <span class="welcome-role-badge role-{{ user.role.toLowerCase() }}">{{ user.role }}</span>
      </div>
    </div>

    <!-- KPI placeholder grid (populated in Phase 8.3 / 8.4) -->
    <div class="kpi-grid">
      <div class="kpi-placeholder"></div>
      <div class="kpi-placeholder"></div>
      <div class="kpi-placeholder"></div>
      <div class="kpi-placeholder"></div>
    </div>

    <!-- Chart placeholder (populated in Phase 8.4) -->
    <div class="chart-placeholder"></div>

  </div>

  <div *ngIf="!user" class="loading">
    <p>Loading...</p>
  </div>

</div>
